<!DOCTYPE html>
<html>
<head>
    <title>Responsive Navbar</title>
    <meta charset="utf-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <script type="text/javascript" src="js/scripts.js" defer></script>
    <link rel="stylesheet" type="text/css" href="css/navbar.css">
    <link rel="stylesheet" type="text/css" href="css/navbar-responsive.css">
    <link rel="stylesheet" href="https://use.fontawesome.com/releases/v7.3.1/css/all.css"/>
    <link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Roboto:ital,wght@0,100..900;1,100..900&display=swap" rel="stylesheet">



</head>

<body>
<!--=============== HEADER ===============-->
<header id="header">
    <nav class="nav flex-between">
        <div class="nav-logo-container">
            <a href="#"><h1>Logo</h1></a>
        </div>
        <!-- menu overlay show when menu open in mobile and tablet devices -->
        <div class="menu-overlay" id="menu-overlay"></div>
        <!-- the menu -->
        <div class="nav-links-container">
            <i class="fa-solid fa-xmark fa-large close-menu-icon" id="menu-close"></i>
            <ul>
                <li><a href="#">Home</a></li>
                <li><a href="#">About</a></li>
                <li><a href="#">Lorem</a></li>
                <li><a href="#">Portfolio</a></li>
                <li><a href="#" class="contact">Contact</a></li>
            </ul>
        </div>

        <div class="nav-menu-container">
            <i class="fa-solid fa-bars-staggered fa-lg open-menu-icon" id="menu-toggle"></i>
        </div>
    </nav>
</header>



<!--=============== MAIN SECTIONS ===============-->
<main class="main flex-center">
    <p>
        RESPONSIVE<br>
        <span>NAVBAR</span>
    </p>
</main>



<!--=============== FOOTER ===============-->
<footer id="footer">

</footer>


</body>
